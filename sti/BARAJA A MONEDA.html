<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertidor Coqueto de Fichas & Siluetas</title>
  <style>
    :root {
      --bg-main: #fcf4f8;
      --bg-card: #ffffff;
      --turquoise: #00c4cc;
      --turquoise-hover: #00a8af;
      --pastel-pink: #fbcfe8;
      --pastel-pink-soft: #fdf2f8;
      --pastel-purple: #f3e8ff;
      --text-dark: #334155;
      --text-sub: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      padding: 20px 12px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--turquoise);
      margin-bottom: 6px;
      font-weight: 700;
    }

    header p.subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .contact-badge {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--bg-card);
      padding: 8px 18px;
      border-radius: 30px;
      border: 2px solid var(--pastel-pink);
      box-shadow: 0 4px 15px rgba(0, 196, 204, 0.06);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .contact-badge .author {
      color: var(--text-dark);
    }

    .contact-badge .wa-link {
      color: var(--turquoise);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .contact-badge .wa-link:hover {
      color: var(--turquoise-hover);
      text-decoration: underline;
    }

    .control-panel {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 196, 204, 0.08);
      margin-bottom: 25px;
      border: 2px solid var(--pastel-pink);
    }

    .upload-zone {
      border: 2px dashed var(--turquoise);
      border-radius: 16px;
      padding: 22px 12px;
      text-align: center;
      cursor: pointer;
      background: var(--pastel-pink-soft);
      transition: all 0.3s ease;
      margin-bottom: 18px;
    }

    .upload-zone:hover {
      background: var(--pastel-purple);
      border-color: var(--turquoise-hover);
    }

    .upload-zone p {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--turquoise);
    }

    .upload-zone span {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    input[type="file"] {
      display: none;
    }

    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      background: #f8fafc;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #f1f5f9;
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .option-group label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-dark);
      white-space: nowrap;
    }

    select, input[type="color"] {
      background: #ffffff;
      color: var(--text-dark);
      border: 2px solid var(--pastel-pink);
      padding: 6px 10px;
      border-radius: 10px;
      outline: none;
      font-size: 0.88rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus, input[type="color"]:focus {
      border-color: var(--turquoise);
    }

    .btn-download-all {
      background: linear-gradient(135deg, var(--turquoise), #06b6d4);
      color: #ffffff;
      border: none;
      padding: 9px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 196, 204, 0.25);
      transition: all 0.2s ease;
    }

    .btn-download-all:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 196, 204, 0.35);
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
      border: 2px solid var(--pastel-pink-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--turquoise);
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-bottom: 12px;
      background: #f1f5f9;
      border-radius: 14px;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      border: 1px solid #e2e8f0;
    }

    .canvas-wrapper:active {
      cursor: grabbing;
    }

    .canvas-wrapper canvas {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .controls-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--pastel-pink-soft);
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .control-row input[type="range"] {
      flex: 1;
      accent-color: var(--turquoise);
      cursor: pointer;
    }

    .btn-reset {
      background: #ffffff;
      color: var(--text-sub);
      border: 1px solid #cbd5e1;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: var(--turquoise);
      color: #ffffff;
      border-color: var(--turquoise);
    }

    .info-tag {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    .btn-download {
      width: 100%;
      padding: 9px;
      background: var(--turquoise);
      color: #ffffff;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      box-shadow: 0 4px 10px rgba(0, 196, 204, 0.2);
      transition: all 0.2s;
    }

    .btn-download:hover {
      background: var(--turquoise-hover);
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      body {
        padding: 12px 8px;
      }

      header h1 {
        font-size: 1.6rem;
      }

      .contact-badge {
        flex-direction: column;
        gap: 4px;
        padding: 8px 14px;
      }

      .control-panel {
        padding: 14px;
        border-radius: 16px;
      }

      .options-grid {
        flex-direction: column;
        align-items: stretch;
      }

      .option-group {
        justify-content: space-between;
        width: 100%;
      }

      .option-group select, .option-group input[type="color"] {
        flex: 1;
        max-width: 60%;
      }

      .btn-download-all {
        width: 100%;
        margin-top: 5px;
      }

      .preview-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>✨ Convertidor Coqueto de Fichas ✨</h1>
      <p class="subtitle">Recortes HD con fondo blanco por defecto, sin fondo opcional y descarga masiva.</p>
      
      <div class="contact-badge">
        <span class="author">👤 Aldo Misael Salazar Muñoz</span>
        <a href="https://wa.me/528117989096" target="_blank" class="wa-link">
          💬 WhatsApp: 81 1798 9096
        </a>
      </div>
    </header>

    <div class="control-panel">
      <div class="upload-zone" onclick="document.getElementById('uploadInput').click()">
        <p>🎀 Arrastra o selecciona tus imágenes aquí</p>
        <span>Procesa múltiples archivos a la vez (.jpg, .png, .webp)</span>
        <input type="file" id="uploadInput" accept="image/*" multiple>
      </div>

      <div class="options-grid">
        <div class="option-group">
          <label for="shapeSelect">Forma:</label>
          <select id="shapeSelect">
            <option value="circle">⚪ Círculo</option>
            <option value="oval">🥚 Óvalo</option>
            <option value="rhombus">♦️ Rombo</option>
            <option value="star">⭐ Estrella</option>
            <option value="can">🥤 Lata / Cilindro</option>
            <option value="bottle">🍼 Biberón</option>
            <option value="phallus">🍆 NEPE</option>
          </select>
        </div>

        <div class="option-group">
          <label for="bgTypeSelect">Fondo:</label>
          <select id="bgTypeSelect">
            <option value="solid">Sólido (JPG)</option>
            <option value="transparent">✨ Sin Fondo (Transparente PNG)</option>
          </select>
        </div>

        <div class="option-group" id="colorPickerGroup">
          <label for="bgColor">Color de Fondo:</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>

        <div class="option-group">
          <label for="borderStyle">Marco Dorado:</label>
          <select id="borderStyle">
            <option value="normal">Estándar (3.5%)</option>
            <option value="thick">Grueso (5%)</option>
            <option value="thin">Fino (2%)</option>
            <option value="none">Sin marco</option>
          </select>
        </div>

        <button class="btn-download-all" id="downloadAllBtn" style="display: none;">
          📦 Descargar Todas
        </button>
      </div>
    </div>

    <div class="preview-grid" id="outputGrid"></div>
  </div>

  <script>
    const uploadInput = document.getElementById('uploadInput');
    const outputGrid = document.getElementById('outputGrid');
    const bgColorInput = document.getElementById('bgColor');
    const bgTypeSelect = document.getElementById('bgTypeSelect');
    const borderStyleSelect = document.getElementById('borderStyle');
    const shapeSelect = document.getElementById('shapeSelect');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const colorPickerGroup = document.getElementById('colorPickerGroup');

    let cardsData = [];

    bgTypeSelect.addEventListener('change', () => {
      if (bgTypeSelect.value === 'transparent') {
        colorPickerGroup.style.display = 'none';
      } else {
        colorPickerGroup.style.display = 'flex';
      }
      refreshAll();
    });

    uploadInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      files.forEach((file) => {
        if (!file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const nativeWidth = img.naturalWidth || img.width;
            const nativeHeight = img.naturalHeight || img.height;
            const canvasSize = Math.max(nativeWidth, nativeHeight);

            const initialScale = Math.max(canvasSize / nativeWidth, canvasSize / nativeHeight);

            const cardObj = {
              id: Symbol(),
              file: file,
              img: img,
              fileName: file.name,
              canvasSize: canvasSize,
              nativeWidth: nativeWidth,
              nativeHeight: nativeHeight,
              zoom: 1.0,
              offsetX: 0,
              offsetY: 0,
              initialScale: initialScale,
              canvas: null,
              ctx: null
            };

            cardsData.push(cardObj);
            createCardUI(cardObj);
            renderCardCanvas(cardObj);
            
            if (cardsData.length > 0) {
              downloadAllBtn.style.display = 'inline-block';
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    });

    bgColorInput.addEventListener('input', refreshAll);
    borderStyleSelect.addEventListener('change', refreshAll);
    shapeSelect.addEventListener('change', refreshAll);

    function refreshAll() {
      cardsData.forEach(cardObj => renderCardCanvas(cardObj));
    }

    downloadAllBtn.addEventListener('click', () => {
      cardsData.forEach((cardObj, idx) => {
        setTimeout(() => {
          const isTransparent = bgTypeSelect.value === 'transparent';
          const mimeType = isTransparent ? 'image/png' : 'image/jpeg';
          const ext = isTransparent ? '_ficha.png' : '_ficha.jpg';
          
          const dataUrl = cardObj.canvas.toDataURL(mimeType, 1.0);
          const downloadName = cardObj.fileName.replace(/\.[^/.]+$/, "") + ext;
          
          const link = document.createElement('a');
          link.href = dataUrl;
          link.download = downloadName;
          link.click();
        }, idx * 300);
      });
    });

    function createCardUI(cardObj) {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="card-title">${cardObj.fileName}</div>
        <div class="canvas-wrapper"></div>
        <div class="controls-group">
          <div class="control-row">
            <label>Zoom:</label>
            <input type="range" class="zoom-slider" min="0.5" max="3" step="0.05" value="1.0">
            <button class="btn-reset">Restablecer</button>
          </div>
        </div>
        <div class="info-tag">Resolución: <b>${cardObj.canvasSize} x ${cardObj.canvasSize} px</b></div>
        <button class="btn-download">Descargar Ficha</button>
      `;

      outputGrid.appendChild(card);

      const canvas = document.createElement('canvas');
      canvas.width = cardObj.canvasSize;
      canvas.height = cardObj.canvasSize;
      cardObj.canvas = canvas;
      cardObj.ctx = canvas.getContext('2d');

      const wrapper = card.querySelector('.canvas-wrapper');
      wrapper.appendChild(canvas);

      const zoomSlider = card.querySelector('.zoom-slider');
      const resetBtn = card.querySelector('.btn-reset');
      const downloadBtn = card.querySelector('.btn-download');

      zoomSlider.addEventListener('input', (e) => {
        cardObj.zoom = parseFloat(e.target.value);
        renderCardCanvas(cardObj);
      });

      wrapper.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.05 : -0.05;
        let newZoom = Math.min(Math.max(cardObj.zoom + delta, 0.5), 3.0);
        cardObj.zoom = newZoom;
        zoomSlider.value = newZoom;
        renderCardCanvas(cardObj);
      }, { passive: false });

      let isDragging = false;
      let startX = 0;
      let startY = 0;

      wrapper.addEventListener('pointerdown', (e) => {
        isDragging = true;
        wrapper.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startY = e.clientY;
      });

      wrapper.addEventListener('pointermove', (e) => {
        if (!isDragging) return;

        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;

        startX = e.clientX;
        startY = e.clientY;

        const rect = canvas.getBoundingClientRect();
        const scaleFactor = cardObj.canvasSize / rect.width;

        cardObj.offsetX += deltaX * scaleFactor;
        cardObj.offsetY += deltaY * scaleFactor;

        renderCardCanvas(cardObj);
      });

      const stopDrag = (e) => {
        if (isDragging) {
          isDragging = false;
          try {
            wrapper.releasePointerCapture(e.pointerId);
          } catch(err) {}
        }
      };

      wrapper.addEventListener('pointerup', stopDrag);
      wrapper.addEventListener('pointercancel', stopDrag);

      resetBtn.addEventListener('click', () => {
        cardObj.zoom = 1.0;
        cardObj.offsetX = 0;
        cardObj.offsetY = 0;
        zoomSlider.value = 1.0;
        renderCardCanvas(cardObj);
      });

      downloadBtn.addEventListener('click', () => {
        const isTransparent = bgTypeSelect.value === 'transparent';
        const mimeType = isTransparent ? 'image/png' : 'image/jpeg';
        const ext = isTransparent ? '_ficha.png' : '_ficha.jpg';

        const dataUrl = canvas.toDataURL(mimeType, 1.0);
        const downloadName = cardObj.fileName.replace(/\.[^/.]+$/, "") + ext;
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = downloadName;
        link.click();
      });
    }

    function drawShapePath(ctx, shape, cx, cy, r) {
      ctx.beginPath();
      
      if (shape === 'circle') {
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
      } 
      else if (shape === 'oval') {
        ctx.ellipse(cx, cy, r * 0.72, r, 0, 0, Math.PI * 2);
      } 
      else if (shape === 'rhombus') {
        ctx.moveTo(cx, cy - r);
        ctx.lineTo(cx + r * 0.85, cy);
        ctx.lineTo(cx, cy + r);
        ctx.lineTo(cx - r * 0.85, cy);
        ctx.closePath();
      } 
      else if (shape === 'star') {
        const spikes = 5;
        const outerRadius = r;
        const innerRadius = r * 0.45;
        let rot = (Math.PI / 2) * 3;
        let x = cx;
        let y = cy;
        let step = Math.PI / spikes;

        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
          x = cx + Math.cos(rot) * outerRadius;
          y = cy + Math.sin(rot) * outerRadius;
          ctx.lineTo(x, y);
          rot += step;

          x = cx + Math.cos(rot) * innerRadius;
          y = cy + Math.sin(rot) * innerRadius;
          ctx.lineTo(x, y);
          rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
      } 
      else if (shape === 'can') {
        const w = r * 0.65;
        const h = r * 0.95;
        const rx = w * 0.3;
        
        ctx.moveTo(cx - w + rx, cy - h);
        ctx.lineTo(cx + w - rx, cy - h);
        ctx.quadraticCurveTo(cx + w, cy - h, cx + w, cy - h + rx);
        ctx.lineTo(cx + w, cy + h - rx);
        ctx.quadraticCurveTo(cx + w, cy + h, cx + w - rx, cy + h);
        ctx.lineTo(cx - w + rx, cy + h);
        ctx.quadraticCurveTo(cx - w, cy + h, cx - w, cy + h - rx);
        ctx.lineTo(cx - w, cy - h + rx);
        ctx.quadraticCurveTo(cx - w, cy - h, cx - w + rx, cy - h);
        ctx.closePath();
      } 
      else if (shape === 'bottle') {
        const bw = r * 0.55; 
        const bh = r * 0.85; 

        ctx.moveTo(cx - r * 0.12, cy - r * 0.75);
        ctx.bezierCurveTo(cx - r * 0.12, cy - r * 0.98, cx + r * 0.12, cy - r * 0.98, cx + r * 0.12, cy - r * 0.75);
        
        ctx.lineTo(cx + r * 0.32, cy - r * 0.75);
        ctx.quadraticCurveTo(cx + r * 0.35, cy - r * 0.75, cx + r * 0.35, cy - r * 0.7);
        ctx.lineTo(cx + r * 0.35, cy - r * 0.52);
        ctx.quadraticCurveTo(cx + r * 0.35, cy - r * 0.48, cx + r * 0.3, cy - r * 0.48);
        
        ctx.lineTo(cx + bw, cy - r * 0.32);
        ctx.lineTo(cx + bw, cy + bh - r * 0.2);
        ctx.quadraticCurveTo(cx + bw, cy + bh, cx + bw - r * 0.2, cy + bh);
        ctx.lineTo(cx - bw + r * 0.2, cy + bh);
        ctx.quadraticCurveTo(cx - bw, cy + bh, cx - bw, cy + bh - r * 0.2);
        
        ctx.lineTo(cx - bw, cy - r * 0.32);
        ctx.lineTo(cx - r * 0.3, cy - r * 0.48);
        ctx.quadraticCurveTo(cx - r * 0.35, cy - r * 0.48, cx - r * 0.35, cy - r * 0.52);
        ctx.lineTo(cx - r * 0.35, cy - r * 0.7);
        ctx.quadraticCurveTo(cx - r * 0.35, cy - r * 0.75, cx - r * 0.32, cy - r * 0.75);
        ctx.lineTo(cx - r * 0.12, cy - r * 0.75);
        ctx.closePath();
      }
      else if (shape === 'phallus') {
        const sw = r * 0.28;           
        const topY = cy - r * 0.92;    
        const coronaY = cy - r * 0.38; 
        const baseY = cy + r * 0.45;   
        const testR = r * 0.42;        
        const testX = r * 0.35;        

        const dxR = sw - testX;
        const dyR = -Math.sqrt(Math.max(0, testR * testR - dxR * dxR));
        const startAngleR = Math.atan2(dyR, dxR);
        
        const dyBottom = Math.sqrt(Math.max(0, testR * testR - testX * testX));
        const endAngleR = Math.atan2(dyBottom, -testX);

        const startAngleL = Math.atan2(dyBottom, testX);
        const endAngleL = Math.atan2(dyR, -dxR);

        ctx.moveTo(cx, topY);

        ctx.bezierCurveTo(
          cx + sw * 0.8, topY,
          cx + sw * 1.4, topY + r * 0.2,
          cx + sw * 1.35, coronaY
        );

        ctx.lineTo(cx + sw, coronaY + r * 0.06);
        ctx.lineTo(cx + testX + dxR, baseY + dyR);

        ctx.arc(cx + testX, baseY, testR, startAngleR, endAngleR, false);
        ctx.arc(cx - testX, baseY, testR, startAngleL, endAngleL, false);

        ctx.lineTo(cx - sw, coronaY + r * 0.06);
        ctx.lineTo(cx - sw * 1.35, coronaY);

        ctx.bezierCurveTo(
          cx - sw * 1.4, topY + r * 0.2,
          cx - sw * 0.8, topY,
          cx, topY
        );

        ctx.closePath();
      }
    }

    function renderCardCanvas(cardObj) {
      const { ctx, canvasSize, img, nativeWidth, nativeHeight, initialScale, zoom, offsetX, offsetY } = cardObj;

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      const center = canvasSize / 2;
      const radius = canvasSize / 2;
      const selectedShape = shapeSelect.value;
      const isTransparent = bgTypeSelect.value === 'transparent';

      const borderMode = borderStyleSelect.value;
      let borderRatio = 0.035; 
      if (borderMode === 'thick') borderRatio = 0.05;
      if (borderMode === 'thin') borderRatio = 0.02;
      if (borderMode === 'none') borderRatio = 0;

      const borderWidth = canvasSize * borderRatio;
      const effectiveRadius = radius - (borderWidth * 1.2);

      ctx.clearRect(0, 0, canvasSize, canvasSize);

      if (!isTransparent) {
        ctx.fillStyle = bgColorInput.value;
        ctx.fillRect(0, 0, canvasSize, canvasSize);
      }

      ctx.save();
      drawShapePath(ctx, selectedShape, center, center, effectiveRadius);
      ctx.clip();

      const finalScale = initialScale * zoom;
      const scaledW = nativeWidth * finalScale;
      const scaledH = nativeHeight * finalScale;

      const x = (canvasSize - scaledW) / 2 + offsetX;
      const y = (canvasSize - scaledH) / 2 + offsetY;

      ctx.drawImage(img, x, y, scaledW, scaledH);
      ctx.restore();

      if (borderWidth > 0) {
        ctx.save();
        drawShapePath(ctx, selectedShape, center, center, effectiveRadius);
        ctx.lineWidth = borderWidth;
        
        const grad = ctx.createRadialGradient(
          center, center, effectiveRadius - borderWidth,
          center, center, effectiveRadius + borderWidth
        );
        grad.addColorStop(0, '#d4af37');
        grad.addColorStop(0.3, '#fff2a3');
        grad.addColorStop(0.6, '#f39c12');
        grad.addColorStop(1, '#8b6508');

        ctx.strokeStyle = grad;
        ctx.stroke();

        ctx.lineWidth = Math.max(2, canvasSize * 0.003);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.stroke();
        ctx.restore();
      }
    }
  </script>
</body>
